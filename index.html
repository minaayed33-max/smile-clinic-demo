<style>
:root{--navy:#0c2a5a;--blue:#2a5db0;--sky:#eaf2fb;--ink:#0f2340;--mut:#51637f;--line:#d6e2f2;--r:14px;--sh:0 6px 24px rgba(12,42,90,.08)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:Cairo,Tahoma,Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.75;overflow-x:hidden}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}[hidden]{display:none!important}
.wrap{max-width:1120px;margin:auto;padding:0 20px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sec{padding:84px 0}.alt{background:var(--sky)}
h1,h2,h3{line-height:1.3;color:var(--navy)}
h2{font-size:clamp(26px,4vw,38px);font-weight:800;margin-bottom:8px}
.sub{color:var(--mut);max-width:60ch;margin-bottom:34px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--navy);background:var(--navy);color:#fff;font:inherit;font-weight:600;padding:9px 24px;border-radius:999px;cursor:pointer;transition:transform .2s,background .2s,color .2s}
.btn:hover{background:var(--blue);border-color:var(--blue);transform:translateY(-1px)}
.btn.o{background:transparent;color:var(--navy)}.btn.o:hover{color:#fff}
.badge{display:inline-block;background:var(--sky);color:var(--blue);font-weight:600;font-size:13px;padding:0 12px;border-radius:999px;border:1px solid var(--line)}
.demo{background:var(--navy);color:#fff;text-align:center;font-size:13px;padding:5px 10px}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:66px;position:relative}
.logo{font-weight:800;font-size:20px;color:var(--navy);margin-inline-end:auto}
.nav{display:flex;gap:18px;font-size:14.5px;font-weight:600}.nav a:hover{color:var(--blue)}
.lang{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 12px;font:inherit;font-weight:600;cursor:pointer;color:var(--navy)}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:40px;height:40px;cursor:pointer;color:var(--navy);font-size:20px}
.hero{position:relative;background:var(--sky);overflow:hidden}
.hbg{position:absolute;inset:0}.hbg img{width:100%;height:100%;object-fit:cover;object-position:75% center}
[dir=rtl] .hbg img{transform:scaleX(-1)}
.hbg:after{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(255,255,255,.95) 0,rgba(255,255,255,.78) 36%,rgba(255,255,255,0) 62%)}
[dir=rtl] .hbg:after{background:linear-gradient(to left,rgba(255,255,255,.95) 0,rgba(255,255,255,.78) 36%,rgba(255,255,255,0) 62%)}
.hero .wrap{position:relative;display:flex;align-items:center;min-height:600px;padding-top:70px;padding-bottom:70px}
.htext{max-width:510px}.hero h1{font-size:clamp(34px,5.5vw,54px);font-weight:800;margin:12px 0}
.hero p{font-size:18px;color:var(--mut);margin-bottom:24px}.acts{display:flex;flex-wrap:wrap;gap:12px}
.tr{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:26px;font-size:14px;font-weight:600}
.tr li:before{content:"✓";color:var(--blue);margin-inline-end:6px;font-weight:800}
.strip{border-bottom:1px solid var(--line)}.strip .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 20px;padding-top:20px;padding-bottom:20px}
.si{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;transition:color .2s}.si:hover{color:var(--blue)}
.ic{width:26px;height:26px;fill:none;stroke:var(--blue);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(12,42,90,.13)}
.card .ic{width:34px;height:34px;margin-bottom:10px}.card h3{font-size:18px;margin-bottom:4px}.card p{color:var(--mut);font-size:15px}
.lm{display:inline-block;margin-top:10px;color:var(--blue);font-weight:600;font-size:14px}.lm:hover{text-decoration:underline}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}.two p{color:var(--mut);margin-bottom:12px}
.imgs{display:grid;gap:14px}.imgs img{width:100%;border-radius:var(--r);box-shadow:var(--sh)}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,300px));gap:26px;justify-content:center}
.doc .ph{position:relative;margin-bottom:12px}.doc img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r)}
.doc .tag{position:absolute;top:10px;inset-inline-start:10px;background:#fff}
.role{color:var(--blue);font-weight:600}.q{color:var(--mut);font-size:14px;margin-top:6px}
.vp{background:none;border:0;font:inherit;font-weight:600;color:var(--navy);cursor:pointer;padding:2px 0;text-decoration:underline}
.ba{position:relative;max-width:640px;margin:0 auto 10px;border-radius:var(--r);overflow:hidden;background:linear-gradient(#e9a0a6,#d9838b);direction:ltr;aspect-ratio:5/2;--p:50%;box-shadow:var(--sh)}
.ba svg{position:absolute;inset:0;width:100%;height:100%}.bef{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.hd{position:absolute;top:0;bottom:0;left:var(--p);width:3px;background:#fff;pointer-events:none}.ba:focus-within{outline:3px solid var(--blue)}
.bl{position:absolute;top:10px;background:rgba(12,42,90,.8);color:#fff;font-size:12px;padding:0 10px;border-radius:999px}
.note{text-align:center;font-size:13px;color:var(--mut);margin-bottom:28px}
.card blockquote{font-size:16px;color:var(--ink);margin:10px 0}.card figcaption{font-size:14px;color:var(--mut)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;max-width:760px}.f{display:flex;flex-direction:column}.full{grid-column:1/-1}
label{font-weight:600;font-size:14px;margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[aria-invalid=true],select[aria-invalid=true]{border-color:#b3261e}.er{color:#b3261e;font-size:13px;min-height:18px}
.ok{max-width:560px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:34px;box-shadow:var(--sh);margin:auto}
.ok svg{width:64px;height:64px;fill:none;stroke:var(--blue);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;animation:pop .45s}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.em{background:var(--navy);color:#fff;padding:50px 0}.em .wrap{display:flex;flex-wrap:wrap;gap:16px 30px;align-items:center;justify-content:space-between}
.em h2{color:#fff;margin:0}.em .btn{background:#fff;color:var(--navy);border-color:#fff}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 18px;margin-bottom:10px;max-width:780px}
summary{cursor:pointer;font-weight:600;color:var(--navy)}details p{margin-top:6px;color:var(--mut);animation:fd .25s}
@keyframes fd{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ct ul{list-style:none;padding:0}.ct li{padding:5px 0}
.map{min-height:260px;border-radius:var(--r);border:1px solid var(--line);display:grid;place-items:center;text-align:center;color:var(--mut);background:linear-gradient(90deg,rgba(42,93,176,.08) 1px,transparent 1px) 0 0/36px 36px,linear-gradient(rgba(42,93,176,.08) 1px,transparent 1px) 0 0/36px 36px,var(--sky)}
footer{background:var(--navy);color:#c9d8ee;padding:50px 0 20px;font-size:14.5px}
footer .g{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:30px}footer h3{color:#fff;font-size:16px;margin-bottom:8px}footer a{display:block}footer a:hover{color:#fff}
footer .b{border-top:1px solid rgba(255,255,255,.2);margin-top:30px;padding-top:16px;text-align:center}
.wa{position:fixed;bottom:20px;inset-inline-start:20px;z-index:30;background:#1f9d55;color:#fff;font-weight:600;border-radius:999px;padding:10px 20px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.mb{display:none}
.fu{opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}.fu.in{opacity:1;transform:none}
@media(max-width:1100px){.burger{display:block}.hb{display:none}.nav{display:none;position:absolute;top:100%;inset-inline:0;background:#fff;flex-direction:column;gap:0;padding:8px 20px 14px;border-bottom:1px solid var(--line);box-shadow:var(--sh)}.nav.open{display:flex;animation:fd .2s}.nav a{padding:10px 0;border-bottom:1px solid var(--line)}}
@media(max-width:760px){body{padding-bottom:64px}.sec{padding:56px 0}.wa{display:none}.two,footer .g,.form{grid-template-columns:1fr}.hbg{position:relative;height:250px}.hbg:after{background:linear-gradient(to top,#fff,rgba(255,255,255,0) 45%)!important}.hero{background:#fff}.hero .wrap{min-height:0;padding-top:6px;padding-bottom:40px}
.mb{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:fixed;bottom:0;inset-inline:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:8px 12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.fu{opacity:1;transform:none}}
.sig{margin-top:30px;padding:22px 24px;border:1px solid rgba(255,255,255,.22);border-radius:var(--r);display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.sig b{display:block;color:#fff;font-size:18px}.sig span{color:#c9d8ee}
.sig .acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sig .btn{background:#fff;color:var(--navy);border-color:#fff}.sig .btn:hover{background:var(--sky);border-color:var(--sky)}
.sig a.lk{text-decoration:underline;font-size:14px}
.gimg{max-width:680px;margin:0 auto 10px;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}.gimg img{width:100%;height:auto;display:block}
</style>
</head>
